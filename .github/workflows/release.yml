name: Build AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Older glibc keeps the AppImage compatible with more distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libfuse2

      - name: Build the AppImage
        env:
          DSH_DESKTOP_SRC: ${{ runner.temp }}/dsh-src
        run: ./build.sh --appimage

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-appimage
          path: dist/*.AppImage

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
